<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palafrugell Accessible</title>
<meta name="description" content="Rutes a peu accessibles per a cadira de rodes i gent gran a Palafrugell.">
<meta name="theme-color" content="#e3f3ea">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#2a4a45;--teal:#0e7c78;--green:#2f8a3d;--amber:#b86e00;--red:#b3261e;--paper:#fbf7ef;--line:#c5d0cc;--fs:18px}
*{box-sizing:border-box}html{font-size:var(--fs)}
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:var(--paper);color:#14202e;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(120deg,#e3f3ea,#fdf1d8);color:var(--navy);border-bottom:4px solid #e9a21f;padding:.6rem 1rem;padding-top:calc(.6rem + env(safe-area-inset-top));display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
header img{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0003}
header h1{font-size:1.15rem;margin:0;flex:1;min-width:9rem;line-height:1.2}
header small{display:block;font-weight:400;opacity:.85;font-size:.75rem}
.tools{display:flex;gap:.4rem;align-items:center}
select,input[type=text],textarea{font:inherit;color:inherit;border:2px solid #6b7c78;border-radius:10px;padding:.6rem .7rem;background:#fff;width:100%}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:2px solid var(--navy);background:#fff;color:var(--navy);min-height:3rem;padding:.4rem 1rem}
button.main{background:var(--teal);border-color:var(--teal);color:#fff;width:100%;font-size:1.05rem}
header button{min-height:2.4rem;padding:.1rem .6rem;border-color:var(--teal);background:#fff;color:var(--teal)}
.langs{display:flex;gap:.25rem;align-items:center}.langs button{padding:.1rem .5rem;font-size:.85rem}.langs button[aria-pressed=true]{background:var(--teal);color:#fff}
:focus-visible{outline:4px solid var(--amber);outline-offset:2px}
main{max-width:46rem;margin:0 auto;padding:.8rem}
#mapa{height:42vh;min-height:280px;border:3px solid #fff;border-radius:18px;box-shadow:0 4px 18px #0002}
[role=tablist]{display:flex;gap:.5rem;margin:.8rem 0}
[role=tab]{flex:1}[role=tab][aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:1rem;display:grid;gap:.8rem;box-shadow:0 2px 10px #0001}
.panel[hidden]{display:none}
label{font-weight:700;display:block;margin-bottom:.2rem}
.row{display:flex;gap:.5rem}.row>*{flex:1}.row>button:last-child{flex:0 0 auto}
#sugg{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
#sugg button{width:100%;text-align:left;font-weight:400}
.status{min-height:1.5rem;font-weight:700;color:var(--navy)}
.err{color:var(--red)}
#res{border-left:10px solid var(--line);padding-left:.8rem}
#res.ok{border-color:var(--green)}#res.mid{border-color:var(--amber)}#res.bad{border-color:var(--red)}#res.unk{border-color:#6b7c78}
.score{font-size:2.4rem;font-weight:700;line-height:1}
.ok .lab{color:var(--green)}.mid .lab{color:var(--amber)}.bad .lab{color:var(--red)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.facts div{background:var(--paper);border-radius:10px;padding:.4rem}.facts b{display:block;font-size:1.1rem}
.facts span,.small{font-size:.8rem;color:#33464a}
ul.iss,ol.steps{margin:.3rem 0;padding-left:1.2rem}ul.iss li{margin:.3rem 0}
details summary{font-weight:700;cursor:pointer;min-height:2.5rem}
.disc{font-size:.8rem;border-top:1px solid var(--line);padding-top:.6rem;color:#33464a}
.hp{position:absolute;left:-9999px}
.pin{font-size:22px;text-shadow:0 0 3px #fff,0 0 3px #fff}
footer{text-align:center;font-size:.8rem;padding:1rem;color:#33464a}footer a{color:var(--navy)}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}.chip{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}.chip button{border:0;min-height:2.4rem;border-radius:0;font-weight:400;padding:.2rem .7rem}
#alts{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}#alts:empty{display:none}#alts button[aria-pressed=true]{background:var(--teal);color:#fff}
#nav{position:sticky;top:0;z-index:1000;background:var(--teal);color:#fff;border-radius:14px;padding:.8rem;margin:.6rem 0}#nav[hidden]{display:none}#navTxt{font-size:1.25rem;font-weight:700}#nav button{margin-top:.4rem}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}.acts button.main{width:auto;flex:1 1 100%}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.checks label{font-weight:400;display:flex;gap:.5rem;align-items:center}.checks input{width:1.3rem;height:1.3rem}
.guide{background:#fff8e6;border:2px solid #f0d9a0;border-radius:14px;padding:.4rem .9rem .8rem}.guide summary{font-weight:700;cursor:pointer;min-height:2.6rem;display:flex;align-items:center}
.guide ol{list-style:none;counter-reset:s;margin:.2rem 0 0;padding:0;display:grid;gap:.6rem}.guide li{counter-increment:s;display:flex;gap:.7rem;align-items:flex-start}.guide li::before{content:counter(s);flex:none;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:grid;place-items:center}
#net{background:#fff3cd;border:2px solid #e9a21f;border-radius:12px;padding:.5rem .8rem;margin-bottom:.6rem;font-weight:700}#net[hidden]{display:none}
.acts button[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
</style>
</head>

const LS = (k, d) => { try { return JSON.parse(store.get(k)) || d; } catch (e) { return d; } };
const save = (k, v) => store.set(k, JSON.stringify(v));
const opq = async q => { const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: new URLSearchParams({ data: q }) }); if (!r.ok) throw 0; return (await r.json()).elements; };

/* ---------- Favorits i recents (només al teu dispositiu) ---------- */
let favs = LS('favs', []), recs = LS('recs', []);
function chips() {
  const c = $('#chips'); c.innerHTML = '';
  const mk = (p, ic, fav) => {
    const w = document.createElement('span'); w.className = 'chip';
    const b = document.createElement('button'); b.textContent = ic + ' ' + p.name; b.onclick = () => { $('#to').value = p.name; $('#to').dataset.p = JSON.stringify(p); }; w.append(b);
    if (fav) { const x = document.createElement('button'); x.textContent = '✕'; x.setAttribute('aria-label', '✕ ' + p.name); x.onclick = () => { favs = favs.filter(f => f.name !== p.name); save('favs', favs); chips(); }; w.append(x); }
    c.append(w);
  };
  favs.forEach(p => mk(p, '⭐', 1));
  recs.filter(r => !favs.some(f => f.name === r.name)).forEach(p => mk(p, '🕘'));
}
function remember(b) { recs = [b, ...recs.filter(r => r.name !== b.name)].slice(0, 4); save('recs', recs); chips(); }
$('#to').addEventListener('input', () => delete $('#to').dataset.p);
$('#btnFav').onclick = () => { const b = state.to; if (!b) return; if (!favs.some(f => f.name === b.name)) favs = [b, ...favs].slice(0, 8); save('favs', favs); chips(); setStatus(t('favSaved')); };

/* ---------- Llocs útils (OpenStreetMap) ---------- */
const CAT = {
  wc: ['nwr["amenity"="toilets"]', '🚻'], pk: ['nwr["amenity"="parking"]["capacity:disabled"];nwr["amenity"="parking_space"]["parking_space"="disabled"]', '🅿️'],
  bn: ['node["amenity"="bench"]', '🪑'], wt: ['node["amenity"="drinking_water"]', '🚰'], ph: ['nwr["amenity"="pharmacy"]', '💊'], hl: ['nwr["amenity"~"^(clinic|hospital|doctors)$"]', '🏥']
};
const catOf = g => g.amenity === 'toilets' ? 'wc' : /parking/.test(g.amenity) ? 'pk' : g.amenity === 'bench' ? 'bn' : g.amenity === 'drinking_water' ? 'wt' : g.amenity === 'pharmacy' ? 'ph' : 'hl';
const poiLayer = L.layerGroup().addTo(map);
let poiTok = 0, poiTimer;
/* llocs afegits pels veïns i aprovats (Supabase), dins de la zona visible */
async function sbPlaces(sel, b) {
  if (!SB || !sel.length) return [];
  const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/places?status=eq.approved&kind=in.(${sel.join(',')})&lat=gte.${b.getSouth()}&lat=lte.${b.getNorth()}&lon=gte.${b.getWest()}&lon=lte.${b.getEast()}&select=lat,lon,kind,name,wheelchair&limit=300`, { headers: SBH });
  if (!r.ok) return []; const a = await r.json(); return Array.isArray(a) ? a : [];
}
async function loadPois() {
  const st = $('#pStatus'), tok = ++poiTok; st.className = 'status'; poiLayer.clearLayers();
  const sel = [...document.querySelectorAll('.poi:checked')].map(c => c.value); if (!sel.length) { st.textContent = ''; return; }
  if (map.getZoom() < 15) { st.textContent = t('pZoom'); return; }
  const b = map.getBounds(), bb = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(x => x.toFixed(5)).join(',');
  const q = '[out:json][timeout:25];(' + sel.map(k => CAT[k][0].split(';').map(s => s + `(${bb});`).join('')).join('') + ');out tags center 300;';
  st.textContent = t('pLoad');
  const [osm, com] = await Promise.allSettled([opq(q), sbPlaces(sel, b)]);
  if (tok !== poiTok) return;
  const cv = com.status === 'fulfilled' ? com.value : [];
  if (osm.status === 'rejected' && !cv.length) { st.textContent = t('errnet'); st.className = 'status err'; return; }
  const items = [];
  (osm.status === 'fulfilled' ? osm.value : []).forEach(e => { const la = e.lat ?? (e.center && e.center.lat), lo = e.lon ?? (e.center && e.center.lon); if (la == null) return; const g = e.tags || {}; items.push({ la, lo, k: catOf(g), name: g.name, wc: g.wheelchair, com: false }); });
  /* si OpenStreetMap ja té el mateix tipus de lloc a menys de 25 m, no es duplica */
  cv.forEach(p => { if (CAT[p.kind] && !items.some(i => i.k === p.kind && hav([i.la, i.lo], [p.lat, p.lon]) < 25)) items.push({ la: p.lat, lo: p.lon, k: p.kind, name: p.name, wc: p.wheelchair === 'unknown' ? null : p.wheelchair, com: true }); });
  let n = 0;
  items.forEach(i => {
    if ($('#poiAcc').checked && /^(wc|ph|hl)$/.test(i.k) && i.wc !== 'yes') return;
    const wc = i.wc === 'yes' ? 'wcYes' : i.wc === 'no' ? 'wcNo' : 'wcUnk';
    pin([i.la, i.lo], CAT[i.k][1]).bindPopup(`<b>${esc(i.name)}</b>${i.name ? '<br>' : ''}${/^(wc|pk|ph|hl)$/.test(i.k) ? esc(t(wc)) : ''}${i.com ? '<br>' + esc(t('byNeighbours')) : ''}`).addTo(poiLayer); n++;
  });
  st.textContent = n ? t('pFound').replace('{n}', n) : t('pNone');
}
$('#pShow').onclick = loadPois;
document.querySelectorAll('.poi').forEach(c => c.onchange = loadPois); $('#poiAcc').onchange = loadPois;
map.on('moveend', () => { if ($('#tabP').getAttribute('aria-selected') === 'true') { clearTimeout(poiTimer); poiTimer = setTimeout(loadPois, 700); } });

/* ---------- Navegació en directe ---------- */
let wid = null, wlock = null, warned = new Set(), off = 0, lastRe = 0;
const speak = s => { if (!$('#voice').checked || !window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(s); u.lang = { ca: 'ca-ES', es: 'es-ES', en: 'en-US', fr: 'fr-FR' }[lang]; speechSynthesis.speak(u); };
function startNav() {
  if (!state.cur || !navigator.geolocation) return;
  $('#nav').hidden = false; $('#navTxt').textContent = t('navWait'); $('#navLeft').textContent = ''; $('#navWarn').textContent = ''; warned.clear(); off = 0;
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wlock = l).catch(() => {}); } catch (e) {}
  wid = navigator.geolocation.watchPosition(onPos, () => { $('#navTxt').textContent = t('gpsdenied'); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  $('#btnNav').hidden = true; map.getContainer().scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function stopNav() {
  if (wid !== null) navigator.geolocation.clearWatch(wid); wid = null;
  if (wlock) { wlock.release().catch(() => {}); wlock = null; }
  $('#nav').hidden = true; if (state.cur) $('#btnNav').hidden = !navigator.geolocation;
  if (window.speechSynthesis) speechSynthesis.cancel();
}
function onPos(p) {
  const u = [p.coords.latitude, p.coords.longitude], { rt, cum, ev } = state.cur;
  state.gps = { lat: u[0], lon: u[1], name: t('myloc') };
  if (gpsDot) gpsDot.setLatLng(u); else gpsDot = L.circleMarker(u, { radius: 8, color: '#fff', fillColor: '#1565c0', fillOpacity: 1, weight: 3 }).addTo(map);
  map.panTo(u);
  if (hav(u, rt.pts[rt.pts.length - 1]) < 20) { $('#navTxt').textContent = t('navArr'); $('#navLeft').textContent = ''; speak(t('navArr')); navigator.geolocation.clearWatch(wid); wid = null; return; }
  let bj = 0, bd = 1e9; for (let j = 1; j < rt.pts.length; j++) { const d = dseg(u, rt.pts[j - 1], rt.pts[j]); if (d < bd) { bd = d; bj = j - 1; } }
  if (bd > 35) {
    off++;
    if (off >= 3 && Date.now() - lastRe > 20000) { lastRe = Date.now(); $('#navTxt').textContent = t('navOff'); speak(t('navOff')); run(state.gps, state.to, state.prof).then(startNav).catch(() => {}); }
    return;
  }
  off = 0;
  const left = Math.max(0, cum[cum.length - 1] - cum[bj]), m = rt.steps.find(s => s.i > bj);
  $('#navLeft').textContent = t('navLeft').replace('{d}', left >= 1000 ? (left / 1000).toFixed(1) + ' km' : Math.round(left) + ' m');
  if (m) { const d = cum[m.i] - cum[bj]; $('#navTxt').textContent = t('navNext').replace('{m}', Math.round(d)) + m.s; if (d < 40 && !warned.has('m' + m.i)) { warned.add('m' + m.i); speak(m.s); } }
  else $('#navTxt').textContent = t('navLeft').replace('{d}', left >= 1000 ? (left / 1000).toFixed(1) + ' km' : Math.round(left) + ' m');
  ev.issues.forEach((x, ix) => {
    const d = hav(u, x.p);
    if (d < 30 && !warned.has('h' + ix)) { warned.add('h' + ix); const msg = t('navAhead').replace('{m}', Math.round(d)).replace('{x}', t(x.key)); $('#navWarn').textContent = '⚠️ ' + msg; if (navigator.vibrate) navigator.vibrate(250); speak(msg); }
  });
}
$('#btnNav').onclick = startNav; $('#btnStop').onclick = stopNav;

/* ---------- Avisos en directe (Supabase, opcional) ---------- */
const SB = CFG.SUPABASE_URL && CFG.SUPABASE_KEY, SBK = CFG.SUPABASE_KEY || '';
/* Les claus noves («sb_publishable_…») NO són JWT: només van a la capçalera apikey. Si també van a Authorization, Supabase respon «Invalid JWT». */
const SBH = SBK.startsWith('sb_') ? { apikey: SBK } : { apikey: SBK, Authorization: 'Bearer ' + SBK };
if (SB) fetch(CFG.SUPABASE_URL + '/rest/v1/reports?status=eq.approved&select=lat,lon,street,type,created_at&order=created_at.desc&limit=500', { headers: SBH })
  .then(r => r.json()).then(a => (Array.isArray(a) ? a : []).forEach(r => {
    if (Date.now() - new Date(r.created_at) > 3.15e10) return; r.date = (r.created_at || '').slice(0, 10); reports.push(r);
    pin([r.lat, r.lon], '⚠️').bindPopup(`<b>${esc(r.street)}</b><br>${esc(t(RT[r.type] || 'iRep'))}<br>${esc(r.date)}`).addTo(repLayer);
  })).catch(() => {});
async function sbInsert(f) {
  if (!SB) return 'skip'; const lat = parseFloat(f.get('lat')), lon = parseFloat(f.get('lon')); if (isNaN(lat) || isNaN(lon)) return 'skip';
  const r = await fetch(CFG.SUPABASE_URL + '/rest/v1/reports', { method: 'POST', headers: { ...SBH, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ lat, lon, street: f.get('calle'), type: f.get('problema'), note: f.get('nota') }) });
  if (!r.ok) throw 0; return 'ok';
}

/* ---------- Ajudar: afegir llocs útils i informar de trams ---------- */
function helpMode(m) { $('#fp').style.display = m === 'place' ? 'grid' : 'none'; $('#fr').style.display = m === 'tram' ? 'grid' : 'none'; $('#mPlace').setAttribute('aria-pressed', m === 'place'); $('#mTram').setAttribute('aria-pressed', m === 'tram'); }
$('#mPlace').onclick = () => helpMode('place'); $('#mTram').onclick = () => helpMode('tram');
$('#pAddBtn').onclick = () => { tab('A'); helpMode('place'); map.getContainer().scrollIntoView({ behavior: 'smooth', block: 'start' }); };
async function sbPlace(f) {
  if (!SB) return 'skip'; const lat = parseFloat(f.get('lat')), lon = parseFloat(f.get('lon')); if (isNaN(lat) || isNaN(lon)) return 'skip';
  const r = await fetch(CFG.SUPABASE_URL + '/rest/v1/places', { method: 'POST', headers: { ...SBH, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ lat, lon, kind: f.get('kind'), name: (f.get('nom') || '').trim() || null, wheelchair: f.get('wheelchair') }) });
  if (!r.ok) throw 0; return 'ok';
}
$('#fp').addEventListener('submit', async e => {
  e.preventDefault(); const st = $('#pSt'), btn = $('#pSend');
  if (!$('#pLat').value) { st.className = 'status err'; st.textContent = t('rPosNone'); return; }
  btn.disabled = true; st.className = 'status'; st.textContent = '…';
  try {
    const f = new FormData(e.target); f.append('idioma', lang);
    const jobs = [fetch(e.target.action, { method: 'POST', body: f, headers: { Accept: 'application/json' } }).then(r => { if (!r.ok) throw 0; return 'ok'; }), sbPlace(f)];
    const rs = await Promise.allSettled(jobs); rs.forEach(x => { if (x.status === 'rejected') console.warn('Avís: un enviament ha fallat', x.reason); });
    if (!rs.some(x => x.status === 'fulfilled' && x.value === 'ok')) throw 0;
    st.textContent = t('pSent'); e.target.reset(); $('#pLat').value = ''; $('#pLon').value = ''; $('#rLat').value = ''; $('#rLon').value = ''; $('#pPos').textContent = t('rPosNone'); if (repPin) map.removeLayer(repPin);
  } catch (x) { st.className = 'status err'; st.textContent = t('rerr'); }
  btn.disabled = false;
});

/* ---------- PWA: instal·lar i estat de connexió ---------- */
let deferred = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#btnInstall').hidden = false; });
$('#btnInstall').onclick = async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; $('#btnInstall').hidden = true; };
window.addEventListener('appinstalled', () => { $('#btnInstall').hidden = true; });
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches) $('#iosHint').hidden = false;
const netState = () => { $('#net').hidden = navigator.onLine; }; window.addEventListener('online', netState); window.addEventListener('offline', netState); netState();

/* ---------- Triar el destí tocant el mapa ---------- */
let picking = false;
$('#btnPick').onclick = () => { picking = true; setStatus(t('pickMap')); map.getContainer().scrollIntoView({ behavior: 'smooth', block: 'start' }); };
map.on('click', e => { if (!picking) return; picking = false; $('#to').value = e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5); delete $('#to').dataset.p; setStatus(''); });

chips(); applyLang();

</script>
</body>
